[project]
name = "htdp-capture"
version = "0.1.0"
description = "Hardware-free VIVE->LSL->XDF capture app feeding htdp ingest"
requires-python = ">=3.11"
dependencies = ["pylsl>=1.16", "numpy>=1.26", "pyxdf>=1.16"]

[project.scripts]
htdp-capture = "htdp_capture.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "htdp"]
openvr = ["openvr>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/htdp_capture"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/htdp_capture"]

[tool.uv.sources]
htdp = { path = "/Users/alexanderlemberger/human-task-dataset-pipeline", editable = true }

[[tool.mypy.overrides]]
module = "pylsl"
ignore_missing_imports = true
