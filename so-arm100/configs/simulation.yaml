# Scene setup for Isaac Sim: table + one object (AGENTS_NEW.md Task 7 / Sec 13-14).
#
# The real workspace is NOT an elevated table -- the SO-ARM100 base sits directly on
# the desk surface (see circle_grasp_v1's observation.images.overview frame 0: robot
# base and the puzzle board/peg share one flat plane, on a sheet of paper). So "table"
# below is a thin static slab whose TOP surface sits at z=0 (the USD robot's own
# root_joint height), not a raised platform.
#
# Object is a small wooden cylinder -- the "circle" peg from the shape-sorter puzzle
# used across circle_grasp_v1 / circle_insert_50ep (grasp the peg, insert it into the
# board's circle hole). Dimensions and position below are eyeballed from that frame,
# NOT yet measured with calipers/tape on the real setup -- treat as the "manually
# defined initial object position" AGENTS_NEW.md Sec 14 explicitly allows for this
# stage. Re-measure before trusting exact millimeter placement.

table:
  # position is the slab's CENTER; top face = position.z + size.z/2. Kept a hair
  # below z=0 (rather than exactly flush) so it doesn't interpenetrate the robot's
  # own base collider at world reset.
  size: [0.6, 0.6, 0.02]        # x, y, z (m) -- roughly one sheet of A2 paper
  position: [0.0, 0.0, -0.011]  # top face at z=-0.001
  color: [0.9, 0.9, 0.85]       # off-white, matches the paper backdrop

# The knob. MEASURED from the dimensioned drawing in docs/reference/toy.png:
# 13mm across, 13mm tall, one centred on every piece. Added 2026-08-15 after the
# scene-gate side-by-side showed the sim had no knobs at all.
#
# This is not decoration. In docs/reference/board_reference_demo.png the gripper
# closes on the KNOB, not on the piece -- a 13mm post standing proud of a 50mm
# disc. The sim was offering a bare 40mm cylinder instead, i.e. the wrong object
# at the exact moment the policy has to decide how wide to close. The failure
# being fought is "no grasp, 4/8".
knob:
  radius: 0.0065        # 13mm across
  height: 0.013         # 13mm tall
  color: [0.85, 0.72, 0.50]   # the BOARD's birch, not the piece's paint -- the knobs
                              # are bare wood in board_reference_demo.png, same
                              # material as the slab they stand on

object:
  id: circle_peg
  shape: cylinder
  # MEASURED from docs/reference/toy.png (was eyeballed at r=0.02, h=0.03 -- the
  # config said outright to replace it once a measurement existed). The circle
  # recess is 50mm exact, and the pieces are the board's own 12mm thickness.
  radius: 0.025  # 50mm diameter, exact
  height: 0.012
  # DERIVED from docs/reference/board_reference_demo.png on 2026-08-15, replacing a
  # value that was explicitly provisional and, it turns out, on the WRONG SIDE.
  #
  # Method: locate five recesses in that frame by colour, least-squares fit the
  # affine map from the board's own frame (whose recess centres are known from
  # toy.png) to image pixels -- residuals came out at 2-6px on a 1280px frame --
  # then invert the loose peg's pixel position through it. That puts the peg at
  # (+165, -117)mm in the board frame; the board carries a 180-degree yaw, so in
  # world terms that is (-0.165, -0.106).
  #
  # The old [0.14, -0.13] had the same reach from the base (0.191m vs 0.196m) and
  # the opposite sign in x -- the peg sat on the wrong side of the robot, which is
  # exactly what it looked like in the sim viewport.
  position: [-0.165, -0.106, 0.005]  # z = table top (-0.001) + half height (0.006)
  rotation: [0.0, 0.0, 0.0, 1.0]  # x, y, z, w (identity) -- USD/ROS convention
  mass: 0.02   # kg, light wooden peg
  base_friction: 0.5   # both static and dynamic; Isaac default-ish, not measured on real wood/paper
  color: [0.20, 0.55, 0.45]  # matches the peg's green paint in the recording

# Domain randomization ranges for synthetic data generation (AGENTS_NEW.md Task 9 /
# Sec 16 -- values below are copied verbatim from that section's example, i.e. the
# spec's own "conservative, do not start extreme" starting point, not independently
# tuned). motion is NOT re-planned at this stage (Rule 4): the commanded joint
# trajectory is copied verbatim from the parent real episode. That is exactly why the
# object/board POSE axes are inert -- moving them without re-planning mislabels the
# episode. See scripts/generate_synthetic.py and src/augmentation/randomization.py.
# The shape-sorter puzzle board -- the insertion TARGET. Absent from this scene
# until 2026-08-14: the sim had only the table and the peg, so every synthetic
# episode showed the peg with nothing to insert it into, and board pose could not
# vary because there was no board.
#
# Dimensions below are MEASURED, from the dimensioned drawing in
# docs/reference/toy.png (supplied 2026-08-14), not eyeballed. Board is 174mm
# square and 12mm thick. Recess centres are derived from that drawing's own gap
# dimensions -- e.g. the square's bottom edge is 41mm above the board's bottom
# edge and its right edge is 62mm from the board's right edge, which pins the
# middle column; the circle sits 8mm from the right edge and 13mm from the
# bottom. Cross-checked against pixel measurement of the same drawing, agreeing
# to ~1-2mm on every shape.
#
# Only the CIRCLE is dimensionally exact (recess diameter 50mm) -- it is the task
# target and the one that has to be right. The other five are visual placeholders
# at measured centres with area-equivalent extents, because Isaac's core object
# API has no triangle or pentagon primitive. They exist so the rendered board
# carries the right pattern and moves rigidly; they are not insertion targets.
#
# Recesses are visual-only: motion is replayed rather than re-planned (Rule 4), so
# nothing is ever physically inserted, and a collider there would only risk
# spurious contact with the replayed peg.
#
# `rotation` is derived from docs/reference/robot-base.png, a top-down view with the
# robot at the bottom and the board at the top. In that view the board carries the
# drawing's own layout unrotated (triangle top-left, rectangle top-centre, diamond
# top-right; pentagon bottom-left, square bottom-centre, circle bottom-right).
# Looking down -Z with screen-up = world -y, screen-right works out to world -x, so
# the drawing's +x maps to world -x and its +y to world -y: a 180 degree turn about
# Z. Under it the circle lands near-right of the board as the photo shows.
#
# (An earlier revision used -90 deg. That was fitted to the overview frame while the
# board was wrongly placed at +x. The overview camera views the board from roughly
# 90 degrees off this top-down shot, which is why the same board reads as 3x2 in one
# and 2x3 in the other; robot-base.png is the one that shows the robot, so it is the
# one that fixes orientation relative to the robot.)
board:
  size: [0.174, 0.174, 0.012]
  # MEASURED 2026-08-14 from docs/reference/robot-base.png: the board is centred
  # on the robot and its near edge is 65mm from the FRONT EDGE of the robot's
  # base (not from the base origin -- the drawing's dimension line ends at the
  # base plate, and its 90mm matches the USD base's 95.9mm depth).
  #
  # THE ROBOT FACES -Y, not +x. Probed from the USD directly: at zero pose the
  # gripper sits at y in [-0.257, -0.135] and the base spans y in [-0.071,
  # +0.025], so the base's front edge is y=-0.071. Hence
  #   centre y = -0.071 - 0.065 - 0.174/2 = -0.223,  centre x = 0 (centred).
  # An earlier version of this file put the board at +x, which was off the
  # robot's side rather than in front of it.
  #
  # Corroborated by reach: the six recesses land 0.18-0.27m from the base, inside
  # the 0.23-0.30m EE cluster measured during Stage 1 replay validation. The old
  # placement did not.
  position: [0.0, -0.223, 0.005]       # slab CENTRE; top face at table_top(-0.001) + 0.012
  rotation: [0.0, 0.0, 1.0, 0.0]       # x, y, z, w -- 180 deg about +Z, see note above
  # (normalised on read in board_component_pose, so a rounded 0.7071 would not
  # silently rescale the board -- but keep it exact here anyway)
  color: [0.85, 0.72, 0.50]            # light birch ply
  recesses:
    # offset is (x, y) in the BOARD's own frame (the DRAWING's orientation: +x
    # right, +y up), measured from the slab centre.
    # SHAPES, 2026-08-15. Every size below is the drawing's own stated dimension.
    # Until now `triangle` and `pentagon` were `shape: cylinder` -- placeholders that
    # were never replaced, so the two shapes simply were not in the scene, and the
    # diamond was a 39mm square at yaw 45 (55x55mm) rather than the drawing's rhombus.
    #
    # `filled` says whether the piece is SEATED in its recess. A seated piece carries
    # a knob; an empty recess is a bare painted floor, drawn darker. In
    # board_reference_demo.png five are seated and the circle is empty -- and the
    # empty one is the insertion TARGET, so that difference is the only thing telling
    # it apart from five distractors.
    #
    # `offset` is the shape's CENTRE (circumcentre for the regular polygons), measured
    # off toy.png against its 174mm board: the drawing is to scale, and reading it that
    # way reproduced every stated dimension it also labels (triangle side 52 -> 51.5
    # measured, pentagon side 32 -> 51.1x50.0 vs 51.8x49.2 predicted, square 46 -> 46.2,
    # circle 50 -> 50.3, diamond side 42 -> 41.2 implied from its diagonals).
    - {id: triangle,  offset: [-0.0528,  0.0265], shape: polygon, sides: 3, side: 0.052,   color: [0.90, 0.50, 0.25], filled: true}
    - {id: rectangle, offset: [ 0.0014,  0.0461], shape: rect,    size: [0.043, 0.063],    color: [0.20, 0.35, 0.70], filled: true}
    # Side 42mm, drawn 45.9 wide x 68.5 tall -- a rhombus, markedly taller than wide.
    # Diagonals below are that measured aspect scaled to the stated 42mm side.
    - {id: diamond,   offset: [ 0.0551,  0.0332], shape: rhombus, size: [0.0468, 0.0698],  color: [0.45, 0.25, 0.55], filled: true}
    - {id: pentagon,  offset: [-0.0520, -0.0516], shape: polygon, sides: 5, side: 0.032,   color: [0.20, 0.55, 0.35], filled: true}
    - {id: square,    offset: [ 0.0014, -0.0226], shape: rect,    size: [0.046, 0.046],    color: [0.88, 0.42, 0.35], filled: true}
    # The one that matters: recess diameter 50mm, exact. Empty -- its piece is the
    # loose peg under `object:`, which is why that peg is 50mm too.
    - {id: circle,    offset: [ 0.0532, -0.0489], shape: circle,  radius: 0.025,           color: [0.20, 0.55, 0.45], filled: false}

# Domain randomization ranges for synthetic data generation (AGENTS_NEW.md Task 9 /
# Sec 16 -- values below are copied verbatim from that section's example, i.e. the
# spec's own "conservative, do not start extreme" starting point, not independently
# tuned). motion is NOT re-planned at this stage (Rule 4): the commanded joint
# trajectory is copied verbatim from the parent real episode. That is exactly why the
# object/board POSE axes are inert -- moving them without re-planning mislabels the
# episode. See scripts/generate_synthetic.py and src/augmentation/randomization.py.


# SPLIT 2026-08-15 into label-preserving axes (active) and label-breaking ones
# (under `label_breaking:`, inert by default). generate_synthetic.py copies the
# parent episode's actions VERBATIM, so an axis is only safe to randomize if the
# copied actions stay correct after it moves. See the module docstring in
# src/augmentation/randomization.py for the full argument.
randomization:
  # -- LABEL-PRESERVING ------------------------------------------------------
  # Yaw of the peg. Safe ONLY because the peg is a cylinder, so a yaw rotation is
  # geometrically the identity -- neither the frames nor the reach change. Move to
  # label_breaking: the moment a non-symmetric object is used.
  object_rotation_deg:
    yaw: [-15, 15]
  mass_scale:
    min: 0.9
    max: 1.1
  friction_scale:
    min: 0.8
    max: 1.2
  # Lighting. Added 2026-08-15, and the one axis here with a measured target rather
  # than a spec default: rollout_grasp_v1_r1's workspace read V 151-164 against the
  # training demos' V 180-188, i.e. the real scene runs at ~0.80-0.91 of the
  # brightness the policy was trained under. The range below reaches 0.75 so 0.80
  # sits inside the training distribution rather than at its edge, and 1.15 on the
  # bright side so the policy is not merely re-tuned to a darker room.
  # Scales BOTH lights (see `lighting:` below for the base values).
  light_intensity_scale:
    min: 0.75
    max: 1.15
  # Azimuth swing of the key light, in degrees, added to `lighting.distant_rotation_deg`'s
  # Z. Moves the shadows rather than the brightness -- the other thing that changes
  # when the room's light source moves or the blind is half-open.
  distant_light_yaw_deg: [-25, 25]
  # Not in AGENTS_NEW.md's example block, but Sec 16's prose also lists these two:
  robot_initial_joint_noise_deg: 3.0   # +/- jitter (per arm joint) applied before the
                                        # settle-to-frame-0 phase, not to the replay itself
  camera_pixel_noise_std: 0.01         # sampled + recorded in provenance; NOT yet applied --
                                        # --capture-dir rendering is a known-unresolved bug,
                                        # see docs/linux-session-handover-2026-08-11.md

  # -- LABEL-BREAKING: INERT unless --allow-label-breaking -------------------
  # Every axis below moves the thing the copied trajectory was reaching for, while
  # the action labels keep pointing at where it used to be. That teaches the policy
  # to ignore the target's position -- which is the failure being fought on hardware
  # (grasp 4/8 on rollout_grasp_v1_r1, 2026-08-15). Datasets containing these
  # episodes are actively harmful, not merely diluted.
  #
  # The ranges are kept, not deleted, for two reasons: they are the tuned values to
  # restore once the actions are re-planned per variation (which needs IK -- the repo
  # has forward kinematics only), and keeping them keeps the random draw order frozen
  # so old seeds still reproduce old episodes exactly (Rule 10).
  #
  # Do NOT pass --allow-label-breaking until the re-planning exists.
  label_breaking:
    object_position:
      x: [-0.03, 0.03]
      y: [-0.03, 0.03]
    # Board pose. Argued for on 2026-08-14 as "the axis that matters for deployment":
    # the real board gets nudged between sessions, measured drift ACROSS
    # circle_insert_50ep was only ~2.5mm (so the real demos carry no signal to learn
    # this from), and the board was found ~19mm out of place on 2026-08-14. That
    # argument is still right about WHY the axis is wanted, but it is the same
    # mislabelling defect as object_position: the insert phase's actions target the
    # board's old pose. It is inert here for that reason, not because it stopped
    # mattering.
    board_position:
      x: [-0.03, 0.03]
      y: [-0.03, 0.03]
    board_rotation_deg:
      yaw: [-10, 10]

# Scene lighting. Hard-coded inline in scripts/export_lerobot_dataset.py until
# 2026-08-15 at dome 2000 / distant 20000 -- and MEASURED on 2026-08-15 to be badly
# blown out at those values: mean pixel 245/255 with 37% of pixels clipped at 255
# (tests/smoke_lighting_isaac.py, sweep in the same session). Every synthetic frame
# ever exported was clipped, and light_intensity_scale moved the mean by 0.1% because
# there was no headroom left to move into.
#
# Values below are picked off that sweep to sit in the linear region with room for
# the +15% end of light_intensity_scale, and to land near the real demos' measured
# brightness (V 180-188; the sweep's whole-frame RGB mean is a rougher measure than
# an HSV patch, so treat this as the right order of magnitude, not a calibration).
#
# Still NOT calibrated against the real room, and distant_rotation_deg in particular
# is inherited, not measured -- the real key light's direction is unknown.
# scripts/check_scene_gate.py now renders with these too, so the side-by-side finally
# shows what actually gets exported. Re-approve the gate after changing them.
lighting:
  dome_intensity: 250
  distant_intensity: 625
  distant_rotation_deg: [-45.0, 30.0, 0.0]   # XYZ euler on the key light

camera:
  # Rough top-down framing matching observation.images.overview's angle. Not
  # calibrated against the real camera mount -- good enough for --capture-dir
  # sanity screenshots, not for anything pixel-accurate.
  # Re-aimed 2026-08-14 after the board was measured onto [0, -0.223]: the old
  # target [0.15, -0.05, 0] was left over from when the board was guessed at +x,
  # and left the board sliced by the frame edge at a steep oblique angle. Caught
  # by the scene gate's side-by-side, which is the point of it.
  # Mirrored in x after the first side-by-side: viewing from +x put the robot to
  # the RIGHT of the board, where the real overview has it to the LEFT. Then
  # pulled back and widened, because at USD's default 50mm the robot filled half
  # the frame and the board was clipped.
  #
  # focal_length is NOT calibrated against the real webcam -- it is chosen to
  # frame the scene like the reference photo. Matching the real camera's
  # intrinsics properly is still open, and matters for sim-to-real transfer of
  # rendered training images.
  position: [-0.50, 0.10, 0.55]
  target: [0.0, -0.20, 0.0]
  focal_length: 20.0

# The wrist camera -- the view whose absence is the leading explanation for
# A/B/C's 0/20 (see docs/replan-2026-08-14-camera-confound.md). Rigidly attached
# to `parent_link`, so it tracks forward kinematics without any per-frame
# orientation maths.
#
# position/target are WORLD coordinates AT THE ROBOT'S REST POSE; the rigid
# camera-to-link offset is taken from them once and preserved thereafter. That
# keeps the numbers directly checkable against a rendered rest frame. Defaults
# put it behind and above the jaws looking forward past them, matching how the
# real wrist view frames the gripper at the bottom of frame -- eyeballed against
# circle_insert_50ep's observation.images.wrist, NOT calibrated to the real mount.
wrist_camera:
  parent_link: gripper     # /World/so_arm100/<parent_link>
  # Must sit OUTSIDE the gripper's own geometry. The first attempt put it at
  # z=0.165, which is exactly the top of the gripper's bounding box
  # (x[-0.024,0.025] y[-0.257,-0.135] z[0.068,0.165] at rest), so the camera was
  # inside the housing and rendered a flat wall of the robot's own yellow.
  # Above the gripper, behind the jaws (which reach y=-0.257), looking forward
  # and down past them at the board.
  position: [0.0, -0.21, 0.19]
  target: [0.0, -0.29, 0.0]
  focal_length: 18.0       # wide, like the real wrist webcam; not calibrated
